<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晓问 · 差旅出行助手</title>
<style>
  :root {
    --ink: #1a1a1a; --paper: #fbf9f4; --accent: #b03a2e; --muted: #8a8a8a;
    --bubble-user: #eae6dc; --bubble-ai: #ffffff; --line: #e2ddd2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--paper); color: var(--ink); height: 100vh; display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 24px; border-bottom: 1px solid var(--line);
    background: #fffdf8; display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 19px; letter-spacing: .5px; }
  header h1 .dot { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  .status .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #4caf50; margin-right: 6px; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #chat { flex: 1; overflow-y: auto; padding: 22px 24px; max-width: 860px;
    width: 100%; margin: 0 auto; }
  .msg { max-width: 78%; margin-bottom: 16px; line-height: 1.65; font-size: 14.5px; }
  .msg .who { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .msg .bubble { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap;
    word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .msg.user { margin-left: auto; }
  .msg.user .bubble { background: var(--bubble-user); border: 1px solid var(--line); }
  .msg.ai .bubble { background: var(--bubble-ai); border: 1px solid var(--line); }
  .msg.ai .tag { font-size: 11px; color: var(--accent); margin-left: 8px; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 34px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-bottom: 20px; max-width: 860px; margin-left: auto; margin-right: auto; }
  .chip { font-size: 12.5px; color: var(--accent); background: #fff8f2;
    border: 1px solid #e5c9c0; border-radius: 999px; padding: 5px 13px; cursor: pointer;
    transition: .15s; }
  .chip:hover { background: #fdefe6; }
  footer { border-top: 1px solid var(--line); background: #fffdf8; padding: 12px 24px; }
  .composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  #input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
    font-size: 14.5px; background: #fff; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { border: none; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 0 20px; font-size: 14.5px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .typing::after { content: "▋"; color: var(--accent); animation: blink 1s infinite; }
</style>
</head>
<body>

<header>
  <h1><span class="dot">晓问</span> · 差旅出行助手</h1>
  <span class="sub">多 Agent 智能出行助手｜六 Worker 主管架构</span>
  <span class="status"><span class="pulse"></span>在线</span>
</header>

<div id="chat"></div>

<div class="hint">试试问这些：</div>
<div class="chips" id="chips"></div>

<footer>
  <div class="composer">
    <input id="input" placeholder="输入差旅问题，回车发送…" autocomplete="off">
    <button id="send">发送</button>
  </div>
</footer>

<script>
const SUGGESTIONS = [
  "帮我规划10月8日去北京开会4天的行程",
  "出差住宿标准是什么",
  "北京今天天气怎么样",
  "我不吃辣，住宿喜欢安静",
  "我上次的行程是什么",
];
const CHAT = document.getElementById("chat");
const INPUT = document.getElementById("input");
const SEND = document.getElementById("send");

// 渲染建议 chips
SUGGESTIONS.forEach(s => {
  const c = document.createElement("div");
  c.className = "chip";
  c.textContent = s;
  c.onclick = () => { INPUT.value = s; send(); };
  document.getElementById("chips").appendChild(c);
});

function addMsg(role, text, tag) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "ai");
  const who = role === "user" ? "你" : "晓问";
  div.innerHTML = `<div class="who">${who}${tag ? `<span class="tag">${tag}</span>` : ""}</div>`
    + `<div class="bubble">${esc(text)}</div>`;
  CHAT.appendChild(div);
  CHAT.scrollTop = CHAT.scrollHeight;
  return div;
}

// 打字机效果
function typeAi(text, tag) {
  const div = addMsg("ai", "", tag);
  const bubble = div.querySelector(".bubble");
  bubble.classList.add("typing");
  let i = 0;
  return new Promise(resolve => {
    const step = () => {
      if (i < text.length) {
        bubble.textContent = text.slice(0, ++i);
        CHAT.scrollTop = CHAT.scrollHeight;
        setTimeout(step, 8);
      } else {
        bubble.classList.remove("typing");
        resolve();
      }
    };
    step();
  });
}

async function send() {
  const text = INPUT.value.trim();
  if (!text) return;
  INPUT.value = "";
  SEND.disabled = true;
  addMsg("user", text);
  const t0 = Date.now();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_input: text }),
    });
    const data = await res.json();
    await typeAi(data.answer, `意图：${data.intent}`);
  } catch (e) {
    addMsg("ai", "⚠️ 网络错误，请确认后端已启动。");
  }
  SEND.disabled = false;
  INPUT.focus();
}

INPUT.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
SEND.onclick = send;
INPUT.focus();

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
