# 晓问 · 差旅出行助手（生产部署形态）
# 一条命令起全套：docker compose up -d --build
#   · postgres：记忆/用户存储（持久化 + 用户隔离）
#   · app：webapp（JWT 认证 + 用户隔离），8000 端口
# API keys（DEEPSEEK_API_KEY 等）从 .env 注入（gitignored，不入库）；
# 生产请设置强 JWT_SECRET：echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
services:
  postgres:
    image: postgres:latest
    container_name: xiao_wen_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: xiao_wen
    ports:
      - "5432:5432"
    volumes:
      - xw_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xiao_wen"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: xiao_wen_app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_URL: postgresql://postgres:123456@postgres:5432/xiao_wen
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  xw_pg_data:
