# 晓问 · 差旅出行助手 CI
# 分层策略（ADR-0008）：
#   · 单元层：任何 push/PR 必跑（ruff + mypy + 单元测试 + PG 真库测试，无需任何密钥）
#   · 集成层：仅当仓库有 LLM secrets 时跑（fork PR 无 secrets 自动跳过，防密钥泄露）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: 单元层（ruff + mypy + 单元测试）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: xiao_wen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xiao_wen_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6

      - name: 同步依赖（含 dev）
        run: uv sync --frozen --all-groups

      - name: 代码检查（ruff）
        run: uv run ruff check src tests plugins scripts

      - name: 格式检查
        run: uv run ruff format --check src tests

      - name: 单元测试（含 PG 真库条件测试）
        env:
          POSTGRES_TEST_URL: postgresql://postgres:123456@localhost:5432/xiao_wen_test
        run: uv run pytest -q -m "not integration"

      - name: 类型检查（mypy）
        run: uv run mypy src/xiao_wen tests

  integration:
    name: 集成层（真实 LLM）
    needs: unit
    runs-on: ubuntu-latest
    # fork PR 无 secrets → 自动跳过（防密钥泄露）
    if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6

      - name: 同步依赖（含 dev）
        run: uv sync --frozen --all-groups

      - name: 集成测试（真实 LLM，约 1 分钟）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: uv run pytest -q -m integration

  docker:
    name: Docker 镜像构建
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t xiao-wen .
