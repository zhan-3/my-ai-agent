# 确定性 CI：PR 只验证后端、前端与契约；镜像只在主分支或手动触发时构建。
# 真实 LLM 与意图契约按需评测，不阻塞日常提交。
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 第三方 action 全部固定到完整 commit SHA（不用 @vN tag）：
#  1) 供应链安全：tag 可被移动/force-push，SHA 不可变、可审计；
#  2) 抗 codeload 限流：同一 SHA 的 action 归档被 GitHub 全局缓存，二次运行零下载，
#     规避 2026-08 遇到的 503/429 action 下载失败。
# 升级 action 时重新解析对应 tag 的 dereferenced commit SHA 并更新注释。
jobs:
  backend:
    name: Backend gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: xiao_wen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xiao_wen_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # setup-uv 下载失败不中断：改用 runner 预装 Python 的 pip 安装 uv 兜底。
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        id: setup-uv
        continue-on-error: true
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Fallback install uv via pip
        if: steps.setup-uv.outcome == 'failure'
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync dependencies
        run: uv sync --frozen --all-groups
      - name: Run backend gate
        env:
          POSTGRES_TEST_URL: postgresql://postgres:123456@localhost:5432/xiao_wen_test
        run: scripts/gate.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Test
        run: pnpm --dir frontend test
      - name: Build
        run: pnpm --dir frontend build

  docker:
    name: Image smoke test
    if: github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: xiao-wen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run image smoke test
        run: scripts/smoke_image.sh xiao-wen:ci
