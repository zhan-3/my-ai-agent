# 晓问 · 差旅出行助手 CI
# 分层策略（ADR-0008）：
#   · 单元层：任何 push/PR 必跑（ruff + mypy + 单元测试 + PG 真库测试，无需任何密钥）
#   · 集成层：仅 push 主分支 + 仓库有 LLM secrets 时跑真 LLM（fork PR 自动跳过，防密钥泄露）
#   · 镜像层：验证 Dockerfile 可构建（带层缓存）
name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支连续推送时取消旧 run，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：job 只需读代码
permissions:
  contents: read

jobs:
  unit:
    name: 单元层（ruff + mypy + 单元测试）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: xiao_wen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xiao_wen_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: 安装 uv（带依赖缓存，加速重建）
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 同步依赖（含 dev）
        run: uv sync --frozen --all-groups

      - name: 代码检查（ruff）
        run: uv run ruff check src tests plugins scripts

      - name: 格式检查
        run: uv run ruff format --check src tests

      - name: 单元测试（含 PG 真库条件测试）
        env:
          POSTGRES_TEST_URL: postgresql://postgres:123456@localhost:5432/xiao_wen_test
        run: uv run pytest -q -m "not integration"

      - name: 类型检查（mypy）
        run: uv run mypy src/xiao_wen tests

  integration:
    name: 集成层（真实 LLM）
    needs: unit
    runs-on: ubuntu-latest
    # 只对主分支推送跑真 LLM（PR 不跑，省配额）
    if: github.event_name == 'push'
    # secrets 上下文不能在 if 里用（GitHub 硬限制）→ 用 env 中转布尔，env 在 if 里可用
    env:
      HAS_LLM_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 uv（带依赖缓存）
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 同步依赖（含 dev）
        run: uv sync --frozen --all-groups

      - name: 集成测试（真实 LLM，约 1 分钟）
        # 仓库未配 secrets（如 fork）→ 自动跳过，防密钥泄露
        if: ${{ env.HAS_LLM_KEY == 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: uv run pytest -q -m integration

  docker:
    name: Docker 镜像构建
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # gha 层缓存（cache-to: type=gha）写缓存需要
    steps:
      - uses: actions/checkout@v5

      - name: 构建镜像（gha 层缓存，重建走缓存）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: xiao-wen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
