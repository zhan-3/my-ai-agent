[project]
name = "my-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "dashscope>=1.26.6",
    "fastapi>=0.141.1",
    "jieba>=0.42.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
# 控制台入口：等价于 uv run python -m xiao_wen.webapp
xiao-wen = "xiao_wen.webapp:main"

[tool.uv.build-backend]
# src 布局：模块目录名与项目名（my-ai-agent → my_ai_agent）不同，显式声明
module-name = "xiao_wen"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
# src 布局：src/xiao_wen 是唯一包，mypy 用它解析 xiao_wen.* 导入
mypy_path = ["src"]
check_untyped_defs = true
# LangGraph Pregel.invoke 的重载对「部分键 State 输入」过严（demo 合法传部分键），
# 全局关闭该错误码；其余错误码保持开启。
disable_error_code = ["call-overload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 分层测试：单元层（无 LLM，快）默认全跑；集成层（真实 LLM API）用 -m integration 显式跑
markers = [
    "integration: 需要真实 LLM API 的集成测试（uv run pytest -m integration）",
]
