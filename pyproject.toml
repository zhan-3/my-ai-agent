[project]
name = "my-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "dashscope>=1.26.6",
    "jieba>=0.42.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
my-ai-agent = "my_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]

[tool.mypy]
python_version = "3.11"
files = ["homework"]
check_untyped_defs = true
# LangGraph Pregel.invoke 的重载对「部分键 State 输入」过严（demo 合法传部分键），
# 全局关闭该错误码；其余错误码保持开启。
disable_error_code = ["call-overload"]
